<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>מטה רוזנבוים – אחוזי הצבעה</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg: #0B1220;
    --panel: #121B2E;
    --line: #1E2A44;
    --text: #E8EDF7;
    --muted: #7C8AA8;
    --accent: #4FD1C5;
    --accent2: #F0B429;
    --danger: #F0645F;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  }
  .wrap{
    min-height:100vh; display:flex; flex-direction:column;
    padding: clamp(16px,2vw,32px);
  }
  header{
    position:relative;
    display:flex; align-items:center; justify-content:flex-start; flex-wrap:wrap; gap:8px;
    min-height: 48px;
    margin-bottom: clamp(12px,1.5vh,24px);
    border-bottom: 1px solid var(--line);
    padding-bottom: clamp(10px,1.2vh,18px);
  }
  h1{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size: clamp(20px, 2.4vw, 38px);
    font-weight:700; margin:0; letter-spacing:.3px; white-space:nowrap;
  }
  .status{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size: clamp(13px,1.1vw,16px);
    color:var(--muted);
  }
  .dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 0 rgba(79,209,197,.6);
    animation: pulse 2s infinite;
    flex-shrink:0;
  }
  .dot.err{ background:var(--danger); box-shadow:none; animation:none; }
  .dot.stale{ background:var(--accent2); box-shadow:none; animation:none; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(79,209,197,.55); }
    70%{ box-shadow:0 0 0 10px rgba(79,209,197,0); }
    100%{ box-shadow:0 0 0 0 rgba(79,209,197,0); }
  }
  .debug{ color:var(--accent2); }
  .summary-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap: clamp(12px,1.5vw,20px);
    margin-bottom: clamp(16px,2vh,26px);
  }
  @media (max-width:700px){ .summary-grid{ grid-template-columns: 1fr; } }
  .summary{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding: clamp(14px,2vh,22px) clamp(16px,2vw,28px);
  }
  .summary .label{
    font-size: clamp(14px,1.3vw,18px); color:var(--muted); font-weight:600;
  }
  .summary .value{
    font-size: clamp(30px,4vw,56px); font-weight:800; color:var(--accent);
    line-height:1;
  }
  .summary .sub{
    font-size: clamp(12px,1vw,15px); color:var(--muted); margin-top:4px;
  }
  .summary-track{
    flex:1; min-width:160px; height:14px; border-radius:7px;
    background:rgba(255,255,255,0.06); overflow:hidden; position:relative;
  }
  .summary-fill{
    position:absolute; top:0; right:0; height:100%; border-radius:7px;
    background:var(--accent); transition:width .5s ease;
  }
  main{
    flex:1; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding: clamp(14px,2vw,28px);
    position:relative;
  }
  .msg{
    color:var(--muted); font-size: clamp(14px,1.4vw,20px); text-align:center;
    padding: 60px 4vw;
  }
  .rows{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: clamp(12px,1.6vh,20px) clamp(20px, 2.5vw, 40px);
    align-items:stretch;
  }
  .row{
    display:flex; flex-direction:column; gap: clamp(6px,0.9vh,10px);
    background: rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:12px;
    padding: clamp(8px,1.1vh,14px) clamp(10px,1.3vw,16px);
    min-width:0;
  }
  .row-head{
    display:flex; align-items:baseline; justify-content:space-between;
    gap: clamp(10px,1.5vw,20px);
    min-width:0;
  }
  .row-head .name-wrap{
    display:flex; align-items:baseline; gap:8px; min-width:0; flex:1;
  }
  .rank{
    color:var(--muted); font-size: clamp(13px,1.1vw,16px); font-weight:600; flex-shrink:0;
  }
  .name{
    font-size: clamp(14px,1.4vw,19px); font-weight:600; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
  }
  .bar-track{
    background: rgba(255,255,255,0.06);
    border-radius:12px; height: clamp(28px,3.6vh,46px);
    position:relative; overflow:hidden; width:100%;
  }
  .bar-fill{
    position:absolute; top:0; right:0; height:100%;
    border-radius:12px;
    transition: width .5s ease;
    min-width: 2px;
    box-shadow: 0 0 14px 0 rgba(0,0,0,.25) inset;
  }
  .pct{
    font-size: clamp(18px,1.9vw,26px); font-weight:800; flex-shrink:0; color:var(--text);
  }
  .expand-toggle{
    background:none; border:none; color:var(--muted); cursor:pointer;
    font-size: clamp(12px,1.2vw,16px); line-height:1; padding:2px 4px;
    transition: transform .2s ease, color .2s ease; flex-shrink:0;
  }
  .expand-toggle:hover{ color:var(--text); }
  .expand-toggle.open{ transform: rotate(180deg); color:var(--text); }
  .members{
    display:none; flex-direction:column; gap: clamp(5px,0.7vh,8px);
    margin-top:2px; padding-top: clamp(6px,0.9vh,10px);
    border-top:1px dashed var(--line);
  }
  .member-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size: clamp(12px,1.1vw,15px); color:var(--muted);
  }
  .member-row .member-name{
    color:var(--text); flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .member-row .member-pct{
    flex-shrink:0; font-weight:700; color:var(--text); min-width:44px; text-align:left;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>מטה רוזנבוים – אחוזי הצבעה בזמן אמת</h1>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">טוען...</span>
    </div>
  </header>
  <div class="summary-grid">
    <div class="summary" id="summary">
      <div>
        <div class="label">אחוז הצבעה מטה רוזנבוים</div>
        <div class="value" id="summaryValue">0%</div>
      </div>
      <div class="summary-track"><div class="summary-fill" id="summaryFill" style="width:0%"></div></div>
    </div>
    <div class="summary" id="likudSummary">
      <div>
        <div class="label">אחוז הצבעה כללי</div>
        <div class="value" id="likudValue">0%</div>
      </div>
      <div class="summary-track"><div class="summary-fill" id="likudFill" style="width:0%"></div></div>
    </div>
  </div>
  <main>
    <div class="msg" id="msg" style="display:none"></div>
    <div class="rows" id="rows"></div>
  </main>
</div>

<script>
/* =======================================================
   הגדרות
   ======================================================= */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRX3F7XeiqRk3OJs6vHnxwm4kQ6LG30nuNzGzLfiqSwkOmnB7A83WwBVKjCt7QTW9CfkVBaxijei9hg/pub?gid=1400064446&single=true&output=csv";
const LIKUD_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRX3F7XeiqRk3OJs6vHnxwm4kQ6LG30nuNzGzLfiqSwkOmnB7A83WwBVKjCt7QTW9CfkVBaxijei9hg/pub?gid=592290359&single=true&output=csv"; // אחוז הצבעה כללי לליכוד - תא A1

const REFRESH_SECONDS     = 10;
const FIRST_NAME_COLUMN   = 0;
const LAST_NAME_COLUMN    = 1;
const SUPPORTERS_COLUMN   = 9;  // סך התומכים המאושרים והפוטנציאליים - משמש לשקלול
const PCT_COLUMN          = 12; // אחוזי הצבעה (עמודה M) - המקור האמיתי לאחוז שמעדכנים בגיליון
const HAS_HEADER_ROW      = true;
const SORT_DESCENDING     = true;
const SHOW_TOP_N          = 0; // 0 = הצג את כולם.
const MIN_SUPPORTERS_TO_SHOW = 10; // מי שיש לו פחות ממספר זה של מתפקדים לא יוצג בגרף
// כל קבוצה: name שמכיל את match יאוחד לשורה אחת המוצגת בשם label,
// עם אפשרות להרחיב ולראות כמה כל תת-פעיל הביא
const MERGE_GROUPS = [
  { match: 'איחוד הצלה', label: 'איחוד הצלה' },
  { match: 'חייט',        label: 'אלכסנדר חייט' },
];

/* ======================================================= */

let secondsAgo = 0;
let lastUpdate = null;
let hasRenderedOnce = false;
const expandedGroups = new Set(); // שמות קבוצות מאוחדות שהמשתמש הרחיב, נשמר בין רענונים

function barColor(pct){
  if(pct >= 75) return '#4FD1C5';
  if(pct >= 50) return '#F0B429';
  return '#F0645F';
}

function setStatus(state, text){
  // state: true = ok, false = hard error, 'stale' = temporary glitch but showing last good data
  const dot = document.getElementById('dot');
  dot.className = 'dot' + (state === true ? '' : state === 'stale' ? ' stale' : ' err');
  document.getElementById('statusText').textContent = text;
}

function showMessage(text){
  const m = document.getElementById('msg');
  const rowsEl = document.getElementById('rows');
  if(text){
    m.style.display = 'block';
    m.textContent = text;
    rowsEl.style.display = 'none';
  } else {
    m.style.display = 'none';
    rowsEl.style.display = 'grid';
  }
}

function render(entries){
  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = '';
  entries.forEach((e, i) => {
    const row = document.createElement('div');
    row.className = 'row';

    const head = document.createElement('div');
    head.className = 'row-head';

    const nameWrap = document.createElement('div');
    nameWrap.className = 'name-wrap';

    const rank = document.createElement('div');
    rank.className = 'rank';
    rank.textContent = (i + 1) + '.';

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = e.name;

    nameWrap.appendChild(rank);
    nameWrap.appendChild(name);

    let membersEl = null;
    if(e.members){
      const isOpen = expandedGroups.has(e.name);
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'expand-toggle' + (isOpen ? ' open' : '');
      toggle.setAttribute('aria-label', 'הצג פירוט תתי פעילים');
      toggle.textContent = '▾';
      toggle.addEventListener('click', () => {
        const willOpen = !expandedGroups.has(e.name);
        if(willOpen) expandedGroups.add(e.name); else expandedGroups.delete(e.name);
        toggle.classList.toggle('open', willOpen);
        if(membersEl) membersEl.style.display = willOpen ? 'flex' : 'none';
      });
      nameWrap.appendChild(toggle);
    }

    const pct = document.createElement('div');
    pct.className = 'pct';
    pct.textContent = e.pct + '%';

    head.appendChild(nameWrap);
    head.appendChild(pct);

    const track = document.createElement('div');
    track.className = 'bar-track';
    const fill = document.createElement('div');
    fill.className = 'bar-fill';
    fill.style.width = Math.max(e.pct, 0) + '%';
    fill.style.background = barColor(e.pct);
    track.appendChild(fill);

    row.appendChild(head);
    row.appendChild(track);

    if(e.members){
      membersEl = document.createElement('div');
      membersEl.className = 'members';
      membersEl.style.display = expandedGroups.has(e.name) ? 'flex' : 'none';
      e.members.forEach(m => {
        const mrow = document.createElement('div');
        mrow.className = 'member-row';

        const mname = document.createElement('div');
        mname.className = 'member-name';
        mname.textContent = m.name;

        const mpct = document.createElement('div');
        mpct.className = 'member-pct';
        mpct.textContent = m.pct + '%';

        mrow.appendChild(mname);
        mrow.appendChild(mpct);
        membersEl.appendChild(mrow);
      });
      row.appendChild(membersEl);
    }

    rowsEl.appendChild(row);
  });
}

async function fetchLikudPct(){
  try{
    const res = await fetch(LIKUD_CSV_URL + (LIKUD_CSV_URL.includes('?') ? '&' : '?') + 'cachebust=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const csvText = await res.text();
    const parsed = Papa.parse(csvText.trim(), { skipEmptyLines: true });
    const raw = (parsed.data?.[0]?.[0] || '0').toString().replace('%', '').trim();
    const pct = parseFloat(raw);
    const value = isNaN(pct) ? 0 : pct;
    document.getElementById('likudValue').textContent = value + '%';
    document.getElementById('likudFill').style.width = Math.max(value, 0) + '%';
  }catch(err){
    console.error('Likud fetch error:', err);
    document.getElementById('likudValue').textContent = '—';
  }
}

async function fetchData(){
  try{
    const res = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 'cachebust=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const csvText = await res.text();

    const parsed = Papa.parse(csvText.trim(), { skipEmptyLines: true });
    let rows = parsed.data;
    if(HAS_HEADER_ROW) rows = rows.slice(1);

    let raw = rows.map(r => {
      const fn = (r[FIRST_NAME_COLUMN] || '').toString().trim();
      const ln = (r[LAST_NAME_COLUMN] || '').toString().trim();
      const fullName = (fn + ' ' + ln).trim();
      const supporters = parseInt((r[SUPPORTERS_COLUMN] || '0').toString().replace(/,/g, '').trim()) || 0;
      const pctRaw = (r[PCT_COLUMN] || '0').toString().replace('%', '').trim();
      const pct = parseFloat(pctRaw);
      return { name: fullName, supporters, pct: isNaN(pct) ? 0 : pct };
    }).filter(e => e.name.length > 0);

    // איחוד שורות ששמן מכיל את אחת המחרוזות שהוגדרו ב-MERGE_GROUPS לשורה אחת
    // האיחוד הוא ממוצע משוקלל לפי כמות התומכים בכל שורה - לא ממוצע פשוט
    // כל תת-פעיל המקורי נשמר תחת members כדי שאפשר יהיה להרחיב ולראות כמה כל אחד הביא
    const groups = new Map();
    raw.forEach(e => {
      const rule = MERGE_GROUPS.find(r => e.name.includes(r.match));
      const key = rule ? rule.label : e.name;
      if(!groups.has(key)) groups.set(key, { name: key, supporters: 0, weightedPctSum: 0, members: [] });
      const g = groups.get(key);
      g.supporters += e.supporters;
      g.weightedPctSum += e.pct * e.supporters;
      g.members.push({ name: e.name, supporters: e.supporters, pct: e.pct });
    });

    let entries = Array.from(groups.values()).map(g => ({
      name: g.name,
      supporters: g.supporters,
      pct: g.supporters > 0 ? Math.round((g.weightedPctSum / g.supporters) * 10) / 10 : 0,
      members: g.members.length > 1 ? g.members.sort((a, b) => b.pct - a.pct) : null
    }));

    // מי שיש לו פחות ממספר המתפקדים המינימלי לא מוצג בגרף בכלל
    entries = entries.filter(e => e.supporters >= MIN_SUPPORTERS_TO_SHOW);

    // אחוז הצבעה כללי - כלל המטה (ממוצע משוקלל לפי תומכים על כל השורות המקוריות)
    const totalSupporters = raw.reduce((s, e) => s + e.supporters, 0);
    const totalWeightedPct = raw.reduce((s, e) => s + (e.pct * e.supporters), 0);
    const overallPct = totalSupporters > 0 ? Math.round((totalWeightedPct / totalSupporters) * 10) / 10 : 0;
    document.getElementById('summaryValue').textContent = overallPct + '%';
    document.getElementById('summaryFill').style.width = Math.max(overallPct, 0) + '%';

    if(SORT_DESCENDING) entries.sort((a, b) => b.pct - a.pct);
    if(SHOW_TOP_N > 0) entries = entries.slice(0, SHOW_TOP_N);

    if(entries.length === 0){
      showMessage('לא זוהו שורות עם שם בגיליון. בדקי את מספרי העמודות בהגדרות.');
    } else {
      showMessage('');
      render(entries);
      hasRenderedOnce = true;
    }

    lastUpdate = new Date();
    secondsAgo = 0;
    setStatus(true, 'מעודכן לפני 0 שניות');
  }catch(err){
    console.error(err);
    if(hasRenderedOnce){
      // כשל זמני - נשמור על הרשימה האחרונה שהוצגה במקום למחוק אותה, ורק נסמן שיש בעיה זמנית בסטטוס
      setStatus('stale', 'תקלה זמנית בעדכון - מציג נתונים אחרונים ידועים');
      setTimeout(fetchData, 5000); // ניסיון חוזר מהיר במקום לחכות למחזור המלא
    } else {
      setStatus(false, 'שגיאה: ' + err.message);
      showMessage('שגיאה בטעינת נתונים. בדקי שהלינק לגיליון תקין ופורסם כ-CSV.');
    }
  }
}

setInterval(() => {
  secondsAgo++;
  if(lastUpdate) setStatus(true, 'מעודכן לפני ' + secondsAgo + ' שניות');
}, 1000);

fetchData();
fetchLikudPct();
setInterval(fetchData, REFRESH_SECONDS * 1000);
setInterval(fetchLikudPct, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
